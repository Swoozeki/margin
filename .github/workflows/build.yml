name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save build log to a branch
        if: always()
        run: |
          tail -n 400 build.log > /tmp/tail.log || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/tail.log build.log
          git add build.log
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin build-log

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk margin.apk
          gh release create "build-${{ github.run_number }}" margin.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }}" \
            --latest
